<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Tuition Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#13203D;
    --navy-light:#1E2E54;
    --navy-lighter:#2A3D6B;
    --surface:#F4F5F8;
    --card:#FFFFFF;
    --border:#E1E4EA;
    --border-soft:#EDEFF3;
    --text:#181D2A;
    --text-soft:#6B7280;
    --text-faint:#9AA1AE;
    --gold:#B9822F;
    --gold-soft:#F5E9D6;
    --gold-deep:#8C5F1E;
    --green:#2F7A4D;
    --green-soft:#E4F1E8;
    --red:#B23A34;
    --red-soft:#FBEAE9;
    --blue:#2E5C8A;
    --blue-soft:#E7EEF6;
    --radius:6px;
    --shadow-none: none;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    background:var(--surface);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input, select, textarea{ font-family:inherit; font-size:14px; }

  /* ---------- Layout ---------- */
  #app{ display:flex; min-height:100vh; }

  .sidebar{
    width:230px;
    flex-shrink:0;
    background:var(--navy);
    color:#DCE2F0;
    display:flex;
    flex-direction:column;
    position:fixed;
    top:0; left:0; bottom:0;
    overflow-y:auto;
  }
  .brand{
    padding:20px 18px 14px 18px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand-mark{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.3px;
    color:#fff;
  }
  .brand-sub{
    font-size:11.5px;
    color:#93A0C2;
    margin-top:2px;
  }
  .nav-group{ padding:14px 10px 4px 10px; }
  .nav-group-label{
    font-size:11px;
    color:#7684A8;
    padding:4px 10px 6px 10px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:9px;
    padding:8px 10px;
    border-radius:5px;
    color:#C7CFE3;
    font-size:13.5px;
    cursor:pointer;
    margin-bottom:2px;
    border-left:3px solid transparent;
  }
  .nav-item:hover{ background:var(--navy-light); }
  .nav-item.active{
    background:var(--navy-light);
    color:#fff;
    border-left:3px solid var(--gold);
    font-weight:500;
  }
  .nav-icon{ width:16px; text-align:center; opacity:0.9; font-size:13px; }

  .main{
    margin-left:230px;
    flex:1;
    padding:26px 34px 60px 34px;
    min-width:0;
  }

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    gap:16px;
  }
  .page-title{ font-size:21px; font-weight:600; color:var(--navy); }
  .page-sub{ font-size:13px; color:var(--text-soft); margin-top:2px; }
  .search-box{
    display:flex;
    align-items:center;
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:7px 10px;
    width:280px;
    gap:7px;
  }
  .search-box input{
    border:none; outline:none; width:100%; font-size:13.5px; background:transparent;
  }

  /* ---------- Cards / Grid ---------- */
  .stat-row{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(170px,1fr));
    gap:14px;
    margin-bottom:24px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .stat-label{ font-size:12px; color:var(--text-soft); margin-bottom:6px; }
  .stat-value{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; color:var(--navy); }
  .stat-value.gold{ color:var(--gold-deep); }
  .stat-value.green{ color:var(--green); }
  .stat-value.red{ color:var(--red); }

  .quick-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:12px;
    margin-bottom:26px;
  }
  .quick-tile{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color .12s ease;
  }
  .quick-tile:hover{ border-color:var(--gold); cursor:pointer; }
  .quick-tile .qi{ font-size:18px; }
  .quick-tile .qt{ font-weight:600; font-size:13.5px; color:var(--navy); }
  .quick-tile .qd{ font-size:12px; color:var(--text-soft); }

  .panel{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:20px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
    flex-wrap:wrap;
    gap:10px;
  }
  .panel-title{ font-size:15px; font-weight:600; color:var(--navy); }

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--text);
    padding:7px 13px;
    border-radius:5px;
    font-size:13px;
    font-weight:500;
  }
  .btn:hover{ border-color:var(--navy-lighter); }
  .btn-primary{ background:var(--navy); color:#fff; border-color:var(--navy); }
  .btn-primary:hover{ background:var(--navy-light); }
  .btn-gold{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .btn-gold:hover{ background:var(--gold-deep); }
  .btn-danger{ background:#fff; color:var(--red); border-color:var(--red-soft); }
  .btn-danger:hover{ background:var(--red-soft); }
  .btn-sm{ padding:4px 9px; font-size:12px; }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-soft); }
  .btn-ghost:hover{ background:var(--border-soft); }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }

  /* ---------- Tables ---------- */
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{
    text-align:left;
    font-size:11.5px;
    color:var(--text-soft);
    font-weight:600;
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  td{
    padding:9px 10px;
    border-bottom:1px solid var(--border-soft);
    vertical-align:middle;
  }
  tr:last-child td{ border-bottom:none; }
  tr.clickable:hover{ background:var(--surface); cursor:pointer; }
  .num{ font-family:'IBM Plex Mono', monospace; }
  .empty-row{ text-align:center; color:var(--text-faint); padding:26px 10px; }

  /* ---------- Badges ---------- */
  .badge{
    display:inline-block;
    padding:2px 9px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:600;
  }
  .badge-green{ background:var(--green-soft); color:var(--green); }
  .badge-red{ background:var(--red-soft); color:var(--red); }
  .badge-gold{ background:var(--gold-soft); color:var(--gold-deep); }
  .badge-blue{ background:var(--blue-soft); color:var(--blue); }
  .badge-grey{ background:#EEF0F3; color:var(--text-soft); }

  /* ---------- Forms ---------- */
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 14px; }
  .form-grid.full{ grid-template-columns:1fr; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.span2{ grid-column:1 / -1; }
  .field label{ font-size:12px; color:var(--text-soft); font-weight:500; }
  .field input, .field select, .field textarea{
    border:1px solid var(--border);
    border-radius:5px;
    padding:8px 10px;
    outline:none;
    width:100%;
    background:#fff;
    color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--navy-lighter); }
  .field textarea{ resize:vertical; min-height:64px; }
  .hint{ font-size:11.5px; color:var(--text-faint); }
  .form-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; }
  .field-error{ font-size:11.5px; color:var(--red); }

  /* Share rows */
  .share-row{ display:grid; grid-template-columns:1.6fr 1fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px; }
  .share-total-bar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border); border-radius:5px;
    padding:8px 12px; margin-top:6px; font-size:13px;
  }
  .share-total-bar.ok{ border-color:var(--green); color:var(--green); background:var(--green-soft); }
  .share-total-bar.bad{ border-color:var(--red); color:var(--red); background:var(--red-soft); }

  /* ---------- Tabs (detail pages) ---------- */
  .tabbar{
    display:flex; gap:4px; border-bottom:1px solid var(--border);
    margin-bottom:18px; flex-wrap:wrap;
  }
  .tabbtn{
    padding:9px 14px; font-size:13px; font-weight:500; color:var(--text-soft);
    border-bottom:2px solid transparent; background:transparent; border-top:none;border-left:none;border-right:none;
  }
  .tabbtn.active{ color:var(--navy); border-bottom:2px solid var(--gold); font-weight:600; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(19,32,61,0.45);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:100;
  }
  .modal{
    background:#fff; border-radius:8px; width:100%; max-width:560px;
    padding:22px 24px 20px 24px; margin-bottom:40px;
  }
  .modal.wide{ max-width:720px; }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .modal-title{ font-size:16px; font-weight:600; color:var(--navy); }
  .modal-close{ background:none; border:none; font-size:18px; color:var(--text-soft); padding:2px 6px; }

  /* ---------- Profile header (detail pages) ---------- */
  .profile-head{
    display:flex; align-items:center; gap:16px; margin-bottom:6px;
  }
  .avatar{
    width:52px; height:52px; border-radius:8px; background:var(--navy);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:19px; font-weight:600; flex-shrink:0;
  }
  .profile-name{ font-size:19px; font-weight:600; color:var(--navy); }
  .profile-meta{ font-size:12.5px; color:var(--text-soft); margin-top:2px; }
  .back-link{ font-size:13px; color:var(--text-soft); margin-bottom:14px; display:inline-flex; gap:6px; align-items:center; }
  .back-link:hover{ color:var(--navy); }

  /* ---------- Calendar month switcher ---------- */
  .month-switch{ display:flex; align-items:center; gap:10px; }
  .month-switch button{ border:1px solid var(--border); background:#fff; border-radius:5px; width:30px; height:30px; }
  .month-label{ font-weight:600; color:var(--navy); font-size:14.5px; min-width:150px; text-align:center; }

  /* ---------- Weekly timetable grid ---------- */
  .tt-grid{ display:grid; grid-template-columns:90px repeat(6,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .tt-cell{ background:#fff; padding:8px; font-size:12px; min-height:44px; }
  .tt-head{ background:var(--navy); color:#fff; font-weight:600; text-align:center; font-size:12px; padding:8px 4px; }
  .tt-time{ background:var(--surface); font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-soft); display:flex; align-items:center; }
  .tt-slot{ background:var(--gold-soft); border-left:3px solid var(--gold); border-radius:3px; padding:4px 6px; font-size:11.5px; margin-bottom:3px; }
  .tt-slot b{ display:block; color:var(--navy); font-size:12px; }

  /* ---------- Utility ---------- */
  .flex{ display:flex; align-items:center; }
  .flex-between{ display:flex; align-items:center; justify-content:space-between; }
  .gap8{ gap:8px; } .gap6{gap:6px;} .gap10{gap:10px;} .gap12{gap:12px;} .gap16{gap:16px;}
  .muted{ color:var(--text-soft); }
  .faint{ color:var(--text-faint); }
  .mt4{margin-top:4px;} .mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;}
  .mb8{margin-bottom:8px;} .mb12{margin-bottom:12px;} .mb16{margin-bottom:16px;}
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--navy); color:#fff;
    padding:10px 16px; border-radius:6px; font-size:13px; z-index:200; box-shadow:0 4px 14px rgba(0,0,0,0.2);
  }
  .empty-state{ text-align:center; padding:40px 20px; color:var(--text-soft); }
  .empty-state .ei{ font-size:26px; margin-bottom:8px; }
  .loading-screen{ height:100vh; display:flex; align-items:center; justify-content:center; color:var(--text-soft); font-size:14px; }
  .chip{ display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:3px 10px; font-size:12px; }
  select.filter, input.filter{ border:1px solid var(--border); border-radius:5px; padding:6px 9px; font-size:12.5px; background:#fff; }
  .divider{ height:1px; background:var(--border-soft); margin:14px 0; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  @media (max-width:900px){
    .grid-2, .grid-3{ grid-template-columns:1fr; }
    .form-grid{ grid-template-columns:1fr; }
  }
  .ai-answer{ background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:14px 16px; font-size:13.5px; white-space:pre-wrap; line-height:1.6; }
  .img-preview{ max-width:100%; max-height:220px; border-radius:6px; border:1px solid var(--border); margin-top:8px; }
  .progress-track{ background:var(--border-soft); border-radius:20px; height:7px; width:100%; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--gold); }

  /* ---------- Form error box ---------- */
  .alert-error{
    background:var(--red-soft); border:1px solid #E7BDBA; border-left:4px solid var(--red);
    border-radius:5px; padding:11px 14px; margin-bottom:14px; color:#7E2621; font-size:13px;
  }
  .alert-error .alert-title{ font-weight:600; margin-bottom:5px; color:var(--red); }
  .alert-error ul{ margin:0; padding-left:18px; }
  .alert-error li{ margin:2px 0; }
  .invalid{ border-color:var(--red) !important; background:#FFF6F5 !important; }

  /* ---------- Sortable table headers ---------- */
  th.sortable{ cursor:pointer; user-select:none; }
  th.sortable:hover{ color:var(--navy); background:var(--surface); }
  th.sortable .sort-ind{ font-size:10.5px; margin-left:4px; color:var(--text-faint); }
  th.sortable.sorted{ color:var(--navy); }
  th.sortable.sorted .sort-ind{ color:var(--gold-deep); }

  .tt-slot small{ display:block; color:var(--text-soft); font-size:11px; font-weight:400; }
  .chk-row{ display:flex; align-items:center; gap:8px; padding:7px 4px; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .chk-row input{ width:auto; }
  .chk-list{ max-height:300px; overflow-y:auto; border:1px solid var(--border); border-radius:5px; padding:2px 8px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip .chip-link{ cursor:pointer; font-weight:500; color:var(--navy); }
  .chip .chip-edit{ border:none; background:none; color:var(--text-faint); cursor:pointer; padding:0 2px; font-size:12px; }
  .chip .chip-edit:hover{ color:var(--gold-deep); }

  .sync-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .sync-dot.on{ background:var(--green); } .sync-dot.off{ background:var(--text-faint); }
</style>
</head>
<body>
<div id="app"><div class="loading-screen">Loading ledger…</div></div>

<script>
(function(){
"use strict";

/* =========================================================
   CONSTANTS
========================================================= */
const CLASS_OPTIONS = ["Play Group","Nursery","K.G 1 (KG-1)","K.G 2 (KG-2)","Prep","Class 1","Class 2","Class 3","Class 4","Class 5","Class 6","Class 7","Class 8","Class 9","Class 10","O Level","A Level / Class 11","Class 12","Other"];
const WEEKDAYS = ["Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const STORE_KEYS = {
  teachers:"teachers", students:"students", templates:"timetableTemplates",
  studentTT:"studentTimetables", homework:"homework", payments:"payments",
  attendance:"attendance", tests:"testResults", aiKeys:"aiKeys"
};

/* =========================================================
   STATE
========================================================= */
let DATA = { teachers:[], students:[], templates:[], studentTT:{}, homework:[], payments:[], attendance:[], tests:[], aiKeys:{} };
let STATE = { view:"dashboard", selectedId:null, detailTab:null, search:"", paymentsMonth:new Date(), attMonth:new Date(), hwFilter:{}, reportTab:"earnings", reportMonth:new Date() };

/* =========================================================
   STORAGE HELPERS
   Primary store: browser localStorage (works for a locally-opened file).
   Secondary: Claude's window.storage, used only if this page happens to be
   rendered inside a Claude.ai artifact panel — never required.
========================================================= */
const LOCAL_PREFIX = "tuitionLedger_";
const hasClaudeStorage = (function(){
  try{ return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'; }
  catch(e){ return false; }
})();

/* ---------------------------------------------------------------
   CLOUD SYNC (Supabase) — optional.
   When configured, every record is read from and written to a shared
   Supabase table, so everyone who opens this page with the same
   project URL + key sees the same live data. Without it, the app
   falls back to this browser's own local storage, same as before.
   Table needed (run once in Supabase's SQL editor):
     create table tuition_ledger (
       key text primary key,
       json text,
       updated_at timestamptz default now()
     );
     alter table tuition_ledger enable row level security;
     create policy "anon read/write" on tuition_ledger
       for all using (true) with check (true);
   --------------------------------------------------------------- */
let sbClient = null, sbReady = false, sbLoading = false, sbChannel = null;
const lastWrittenJson = {};
function getSupabaseConfig(){
  try{ const raw = localStorage.getItem(LOCAL_PREFIX+'sbConfig'); return raw? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function setSupabaseConfig(cfg){ try{ localStorage.setItem(LOCAL_PREFIX+'sbConfig', JSON.stringify(cfg)); }catch(e){} }
function clearSupabaseConfig(){ try{ localStorage.removeItem(LOCAL_PREFIX+'sbConfig'); }catch(e){} }
function loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector('script[data-sb-script="'+src+'"]')){ resolve(); return; }
    const el = document.createElement('script');
    el.src = src; el.setAttribute('data-sb-script', src);
    el.onload = ()=>resolve(); el.onerror = ()=>reject(new Error("Couldn't load "+src));
    document.head.appendChild(el);
  });
}
async function initSupabase(){
  const cfg = getSupabaseConfig();
  if(!cfg || !cfg.url || !cfg.anonKey) return false;
  if(sbReady && sbClient) return true;
  if(sbLoading){ await new Promise(r=>{ const t=setInterval(()=>{ if(!sbLoading){ clearInterval(t); r(); } },100); }); return sbReady; }
  sbLoading = true;
  try{
    await loadScriptOnce('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
    if(!window.supabase || typeof window.supabase.createClient!=='function'){ throw new Error("Supabase script didn't load"); }
    sbClient = window.supabase.createClient(cfg.url, cfg.anonKey);
    sbReady = true;
  }catch(e){
    console.error("Supabase init failed", e);
    sbReady = false; sbClient = null;
  }
  sbLoading = false;
  return sbReady;
}
function subscribeSupabase(){
  if(!sbClient || sbChannel) return;
  sbChannel = sbClient.channel('tuition_ledger_changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'tuition_ledger'}, (payload)=>{
      const row = payload.new;
      if(!row || !row.key) return;
      const k = row.key, json = row.json;
      if(json===undefined || json===lastWrittenJson[k]) return;
      try{ DATA[k] = JSON.parse(json); }catch(e){ return; }
      try{ localStorage.setItem(LOCAL_PREFIX+k, json); }catch(e){}
      if(document.getElementById('app')){ render(); showToast("Updated — synced from another device"); }
    })
    .subscribe();
}
function unsubscribeSupabase(){
  if(sbChannel && sbClient){ try{ sbClient.removeChannel(sbChannel); }catch(e){} }
  sbChannel = null;
}

async function loadAll(){
  const keys = Object.values(STORE_KEYS);
  const sbOk = await initSupabase();
  await Promise.all(keys.map(async k=>{
    let raw = null;
    if(sbOk){
      try{
        const { data, error } = await sbClient.from('tuition_ledger').select('json').eq('key',k).maybeSingle();
        if(!error && data && data.json!==undefined) raw = data.json;
      }catch(e){ console.error("Supabase read failed for "+k, e); }
    }
    if(raw===null){
      try{ raw = localStorage.getItem(LOCAL_PREFIX+k); }catch(e){ raw = null; }
    }
    if(raw===null && hasClaudeStorage){
      try{
        const r = await window.storage.get(k,false);
        if(r && r.value!==undefined) raw = r.value;
      }catch(e){ /* key not found yet, keep default */ }
    }
    if(raw){
      try{ DATA[k] = JSON.parse(raw); }catch(e){ console.error("Couldn't parse stored data for "+k, e); }
    }
  }));
  if(sbOk){ Object.values(STORE_KEYS).forEach(k=>{ lastWrittenJson[k] = JSON.stringify(DATA[k]); }); subscribeSupabase(); }
}
async function save(key){
  const json = JSON.stringify(DATA[key]);
  lastWrittenJson[key] = json;
  let localOk = true;
  try{
    localStorage.setItem(LOCAL_PREFIX+key, json);
  }catch(e){
    localOk = false;
    console.error("Local save failed for "+key, e);
  }
  if(sbReady && sbClient){
    try{
      const { error } = await sbClient.from('tuition_ledger').upsert({ key, json, updated_at: new Date().toISOString() });
      if(error) throw error;
    }catch(e){
      console.error("Supabase save failed for "+key, e);
      showToast("Saved on this device, but couldn't sync to the cloud");
    }
  } else if(hasClaudeStorage){
    try{ await window.storage.set(key, json, false); }catch(e){ /* not fatal */ }
  }
  if(!localOk) showToast("Couldn't save — your browser may be blocking storage for local files");
}

/* ---- Fee cycle helpers ---- */
function getCycleForMonth(student, refDate){
  const y = refDate.getFullYear(), m = refDate.getMonth();
  const startDay = Math.min(student.feeCycleStartDay||1, daysInMonth(y,m));
  const cycleStart = new Date(y,m,startDay);
  const nextStartDay = Math.min(student.feeCycleStartDay||1, daysInMonth(y,m+1));
  const cycleEnd = new Date(y, m+1, nextStartDay-1);
  const cycleKey = y+"-"+String(m+1).padStart(2,'0');
  return { cycleKey, cycleStart, cycleEnd };
}
function getPaymentRecord(studentId, cycleKey){
  return DATA.payments.find(p=>p.studentId===studentId && p.cycleKey===cycleKey);
}
/* Fee status is decided ONLY by the Paid / Unpaid status of a cycle's record. */
function feeStatus(rec){ return (rec && rec.status==='Paid') ? 'Paid' : 'Unpaid'; }
/* A raise (or correction) recorded on the student applies from that month onward only;
   every earlier month keeps whatever fee applied to it at the time. No entries = same
   fee every month, quietly. */
function getFeeForCycle(student, cycleKey){
  let amt = Number(student.totalFee)||0;
  const hist = (student.feeHistory||[]).slice().sort((a,b)=>a.cycleKey.localeCompare(b.cycleKey));
  hist.forEach(h=>{ if(h.cycleKey<=cycleKey) amt = Number(h.amount)||amt; });
  return amt;
}
function currentFeeAmount(student){ return getFeeForCycle(student, currentCycleKeyNow(student)); }
function currentCycleKeyNow(student){ return currentCycleKey(student, new Date()); }
function feePaid(student, cycleKey, rec){
  if(!rec || rec.status!=='Paid') return 0;
  const fee = getFeeForCycle(student, cycleKey);
  const a = Number(rec.amount)||0;
  return a>0 ? a : fee;
}
function feeDue(student, cycleKey, rec){
  if(rec && rec.status==='Paid') return 0;
  return getFeeForCycle(student, cycleKey);
}
/* The cycle a student is in today (a cycle runs from its start day to the day before the next start day). */
function currentCycleKey(student, now){
  now = now || new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const startDay = Math.min(student.feeCycleStartDay||1, daysInMonth(y,m));
  const ref = now.getDate() < startDay ? new Date(y,m-1,1) : new Date(y,m,1);
  return getCycleForMonth(student, ref).cycleKey;
}
function teacherCutOfAmount(student, teacherId, amount){
  const share = (student.shares||[]).find(s=>s.teacherId===teacherId);
  const base = Number(student.totalFee)||0;
  if(!share || !base) return 0;
  if(share.type==='full') return amount;
  if(share.type==='percent') return amount * (share.value/100);
  const prop = share.value / base;
  return amount * prop;
}
/* ---- Month-wise fee record helpers ---- */
function studentCyclesForYear(s, year){
  const now = new Date();
  const lastMonth = year<now.getFullYear() ? 11 : (year===now.getFullYear() ? now.getMonth() : -1);
  const out = [];
  for(let m=0; m<=lastMonth; m++){ const c = getCycleForMonth(s, new Date(year,m,1)); if(c.cycleStart<=now) out.push(c); }
  return out;
}
function shareTotalCheck(shares, totalFee){
  let sumPercent=0, sumFixed=0, hasPercent=false, hasFixed=false;
  shares.forEach(s=>{
    if(s.type==='percent'){ sumPercent+=Number(s.value)||0; hasPercent=true; }
    else if(s.type==='full'){ sumPercent+=100; hasPercent=true; }
    else{ sumFixed+=Number(s.value)||0; hasFixed=true; }
  });
  // Convert fixed into equivalent percent of total to compare uniformly
  let equivalentPercent = sumPercent + (totalFee? (sumFixed/totalFee*100):0);
  return { equivalentPercent, ok: Math.abs(equivalentPercent-100) < 0.5 };
}

function monthlyEarningsTable(teacherId){
  // aggregate across recorded payments
  const map = {}; // cycleKey -> {collected, pending}
  DATA.students.forEach(s=>{
    const sh = (s.shares||[]).find(x=>x.teacherId===teacherId);
    if(!sh) return;
    DATA.payments.filter(p=>p.studentId===s.id).forEach(p=>{
      map[p.cycleKey] = map[p.cycleKey] || {collected:0,pending:0};
      map[p.cycleKey].collected += teacherCutOfAmount(s,teacherId,feePaid(s,p.cycleKey,p));
      map[p.cycleKey].pending += teacherCutOfAmount(s,teacherId,feeDue(s,p.cycleKey,p));
    });
  });
  const keys = Object.keys(map).sort().reverse();
  if(keys.length===0) return `<div class="panel">${emptyState("No payment history yet","Earnings will appear here once monthly payments are recorded.")}</div>`;
  return `<div class="panel"><table><thead><tr><th>Cycle</th><th>Collected</th><th>Pending</th></tr></thead><tbody>
    ${keys.map(k=>`<tr><td class="num">${k}</td><td class="num" style="color:var(--green)">${money(map[k].collected)}</td><td class="num" style="color:var(--red)">${money(map[k].pending)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function statusBadge(status){
  const map = { 'Pending':'badge-red','Submitted':'badge-gold','Checked':'badge-green','Present':'badge-green','Absent':'badge-red','Paid':'badge-green','Partial':'badge-gold','Unpaid':'badge-red' };
  return `<span class="badge ${map[status]||'badge-grey'}">${esc(status)}</span>`;
}
function renderWeekGrid(slots, showStudent, showTimes){
  const byDay = {}; WEEKDAYS.forEach(d=>byDay[d]=[]);
  slots.forEach(sl=>{ if(byDay[sl.day]) byDay[sl.day].push(sl); });
  Object.values(byDay).forEach(arr=>arr.sort((x,y)=>(x.start||"").localeCompare(y.start||"") || String(x.subject).localeCompare(String(y.subject))));
  const cell = sl=>{
    const teacher = sl.teacherId ? ((findTeacher(sl.teacherId)||{}).name||'') : '';
    const timeLine = (showTimes || sl.ownTime) && sl.start && sl.end ? `<small class="num">${esc(fmtTime(sl.start))} – ${esc(fmtTime(sl.end))}</small>` : '';
    return `<div class="tt-slot"><b>${esc(sl.subject)}</b>${teacher? `<small>${esc(teacher)}</small>`:''}${timeLine}${showStudent && sl.studentName? `<small>${esc(sl.studentName)}</small>`:''}</div>`;
  };
  return `<div class="tt-grid">
    <div class="tt-cell tt-head" style="background:var(--navy)"></div>
    ${WEEKDAYS.map(d=>`<div class="tt-head">${d}</div>`).join('')}
    <div class="tt-cell tt-time">Classes</div>
    ${WEEKDAYS.map(d=>`<div class="tt-cell">
      ${byDay[d].length===0? `<span class="faint" style="font-size:11px">—</span>` : byDay[d].map(cell).join('')}
    </div>`).join('')}
  </div>`;
}

function syncShareRows(){
  const rows = Array.from(document.querySelectorAll('[data-share-row]'));
  const chosen = rows.map(r=>r.querySelector('[data-share-teacher]').value).filter(Boolean);
  rows.forEach(r=>{
    const sel = r.querySelector('[data-share-teacher]');
    const mine = sel.value;
    Array.from(sel.options).forEach(o=>{
      if(!o.value) return;
      o.disabled = (o.value!==mine && chosen.includes(o.value));
    });
    const typeSel = r.querySelector('[data-share-type]');
    const valInput = r.querySelector('[data-share-value]');
    if(typeSel.value==='full'){ valInput.value=''; valInput.disabled=true; valInput.placeholder='Full fee'; }
    else{ valInput.disabled=false; valInput.placeholder='Value'; }
  });
}
function recalcShareBar(){
  const totalFeeInput = document.querySelector('input[name="totalFee"]');
  const totalFee = totalFeeInput? Number(totalFeeInput.value)||0 : 0;
  const rows = Array.from(document.querySelectorAll('[data-share-row]'));
  syncShareRows();
  const shares = rows.map(r=>({
    teacherId: r.querySelector('[data-share-teacher]').value,
    type: r.querySelector('[data-share-type]').value,
    value: r.querySelector('[data-share-type]').value==='full' ? 100 : (Number(r.querySelector('[data-share-value]').value)||0)
  })).filter(s=>s.teacherId);
  const {equivalentPercent, ok} = shareTotalCheck(shares, totalFee);
  const bar = document.getElementById('share-total-bar');
  if(!bar) return;
  bar.className = 'share-total-bar ' + (shares.length? (ok?'ok':'bad'):'');
  bar.innerHTML = shares.length? `<span>Total allocated: <b>${equivalentPercent.toFixed(1)}%</b> of fee</span><span>${ok? '✓ Fully distributed' : (equivalentPercent>100? 'Over 100% — adjust shares':'Under 100% — remaining unassigned')}</span>` : '<span class="faint">Add at least one teacher share</span>';
}
function openFeeHistoryModal(studentId){
  const s = findStudent(studentId);
  if(!s) return;
  const now = new Date();
  const monthOptions = [];
  for(let i=-2;i<=6;i++){ const d=new Date(now.getFullYear(), now.getMonth()+i, 1); monthOptions.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')); }
  const history = (s.feeHistory||[]).slice().sort((a,b)=>b.cycleKey.localeCompare(a.cycleKey));
  const monthLabel = ck=>{ const p=ck.split('-').map(Number); return MONTH_NAMES[p[1]-1]+' '+p[0]; };
  const body = `
    <div class="muted mb12" style="font-size:13px">Current fee is <b class="num">${money(currentFeeAmount(s))}</b>. A change here applies from the month you choose onward — every earlier month keeps the fee that applied to it at the time.</div>
    <div class="form-grid">
      <div class="field"><label>New fee (Rs)</label><input name="amount" type="number" min="0" placeholder="e.g. 3500" /></div>
      <div class="field"><label>Effective from</label><select name="fromMonth">${monthOptions.map(ck=>`<option value="${ck}" ${ck===currentCycleKeyNow(s)?'selected':''}>${monthLabel(ck)}</option>`).join('')}</select></div>
    </div>
    ${history.length? `<div class="divider"></div><div class="stat-label mb8">Previous changes</div>
    <table><thead><tr><th>From month</th><th>Fee</th><th></th></tr></thead><tbody>
    ${history.map(h=>`<tr><td>${monthLabel(h.cycleKey)}</td><td class="num">${money(h.amount)}</td><td><button type="button" class="btn btn-sm btn-ghost" data-remove-fee-entry="${h.cycleKey}">Remove</button></td></tr>`).join('')}
    </tbody></table>` : ''}
  `;
  openModal("Change fee — "+s.name, body, (fd)=>{
    const form = document.getElementById('modal-form');
    const amountEl = form.querySelector('[name="amount"]');
    const amount = Number(fd.get('amount'));
    if(!fd.get('amount') || isNaN(amount) || amount<=0) return {errors:["Enter the new fee — it must be greater than 0."], fields:[amountEl]};
    const fromMonth = fd.get('fromMonth');
    s.feeHistory = (s.feeHistory||[]).filter(h=>h.cycleKey!==fromMonth);
    s.feeHistory.push({cycleKey: fromMonth, amount});
    save(STORE_KEYS.students).then(()=>{ closeModal(); render(); showToast("Fee updated from "+monthLabel(fromMonth)); });
  });
  setTimeout(()=>{
    document.querySelectorAll('[data-remove-fee-entry]').forEach(btn=>btn.addEventListener('click',()=>{
      const ck = btn.getAttribute('data-remove-fee-entry');
      s.feeHistory = (s.feeHistory||[]).filter(h=>h.cycleKey!==ck);
      save(STORE_KEYS.students).then(()=>{ closeModal(); render(); showToast("Fee change removed"); });
    }));
  },0);
}
function openStudentModal(id){
  const s = id? findStudent(id): null;
  if(DATA.teachers.length===0){ showToast("Add a teacher first before enrolling a student."); return; }
  openModal(s? "Edit student":"Add student", studentFormHTML(s), (fd)=>{
    const form = document.getElementById('modal-form');
    const errors = [], fields = [];
    const bad = (msg, el)=>{ errors.push(msg); if(el) fields.push(el); };
    const el = n=>form.querySelector('[name="'+n+'"]');

    // --- Student details ---
    const name = (fd.get('name')||'').trim();
    const cls = fd.get('class');
    if(!name) bad("Student name is required.", el('name'));
    else if(!/[A-Za-z\u0600-\u06FF]/.test(name)) bad("Student name must contain letters — please check what you typed.", el('name'));
    if(!cls) bad("Choose the student's class.", el('class'));
    if(name && cls){
      const dup = DATA.students.find(x=>x.id!==(s&&s.id) && (x.name||'').trim().toLowerCase()===name.toLowerCase() && x.class===cls);
      if(dup) bad(`A student named "${name}" is already enrolled in ${cls}. Change the name, or check whether this is a duplicate.`, el('name'));
    }
    const phone = (fd.get('phone')||'').trim();
    if(phone){
      const digits = phone.replace(/\D/g,'');
      if(!/^[0-9+\-\s()]+$/.test(phone) || digits.length<7 || digits.length>15) bad("The phone number looks wrong — use digits only (7 to 15 of them), e.g. 0300-1234567.", el('phone'));
    }

    // --- Fee details ---
    const feeRaw = String(fd.get('totalFee')||'').trim();
    const totalFee = Number(feeRaw);
    if(feeRaw==='' || isNaN(totalFee)) bad("Enter the total monthly fee as a number.", el('totalFee'));
    else if(totalFee<=0) bad("The total monthly fee must be greater than 0.", el('totalFee'));
    const dayRaw = String(fd.get('feeCycleStartDay')||'').trim();
    const day = Number(dayRaw);
    if(dayRaw==='' || !Number.isInteger(day) || day<1 || day>31) bad("Fee cycle start day must be a whole number from 1 to 31.", el('feeCycleStartDay'));

    // --- Teacher fee shares ---
    const rows = Array.from(form.querySelectorAll('[data-share-row]'));
    const chosen = {}, shares = [];
    let rowProblem = false;
    rows.forEach((r,i)=>{
      const tSel = r.querySelector('[data-share-teacher]'), typeSel = r.querySelector('[data-share-type]'), vIn = r.querySelector('[data-share-value]');
      const tid = tSel.value, type = typeSel.value, raw = String(vIn.value||'').trim(), val = Number(raw);
      const label = 'Teacher row '+(i+1);
      if(!tid){
        if(type==='full' || raw!==''){ bad(label+": choose a teacher for this share.", tSel); rowProblem = true; }
        return;
      }
      const tname = (findTeacher(tid)||{}).name || 'this teacher';
      if(chosen[tid]){ bad(`${tname} is added more than once. Remove the duplicate row.`, tSel); rowProblem = true; return; }
      chosen[tid] = true;
      if(type==='full'){ shares.push({teacherId:tid, type:'full', value:100}); return; }
      if(raw==='' || isNaN(val) || val<=0){ bad(`${label} (${tname}): enter a ${type==='percent'?'percentage':'fixed amount'} greater than 0, or choose "Full fee".`, vIn); rowProblem = true; return; }
      if(type==='percent' && val>100){ bad(`${label} (${tname}): a percentage can't be more than 100.`, vIn); rowProblem = true; return; }
      if(type==='fixed' && totalFee>0 && val>totalFee){ bad(`${label} (${tname}): the fixed amount ${money(val)} is more than the total fee ${money(totalFee)}.`, vIn); rowProblem = true; return; }
      shares.push({teacherId:tid, type, value:val});
    });
    if(shares.length===0 && !rowProblem){
      bad("Add at least one teacher and set how much of the fee they receive.", rows[0] && rows[0].querySelector('[data-share-teacher]'));
    }
    if(shares.length>0 && !rowProblem && totalFee>0){
      const eq = shareTotalCheck(shares, totalFee).equivalentPercent;
      if(Math.abs(eq-100) >= 0.01){
        const allocated = totalFee*eq/100;
        const eqTxt = String(Math.round(eq*10)/10);
        bad(`The teachers' shares add up to ${eqTxt}% (${money(allocated)} of ${money(totalFee)}). ` + (eq<100 ? `${money(totalFee-allocated)} is still unassigned — the shares must add up to exactly 100%.` : `That is more than the total fee — reduce the shares so they add up to exactly 100%.`),
            null);
        rows.forEach(r=>{ const v = r.querySelector('[data-share-value]'); if(v && !v.disabled) fields.push(v); });
      }
    }

    if(errors.length) return { errors, fields: fields.filter(Boolean) };

    const obj = {
      id: s? s.id: uid(),
      name, class: cls,
      guardianName: (fd.get('guardianName')||'').trim(), phone, address: (fd.get('address')||'').trim(),
      totalFee, feeCycleStartDay: day,
      shares
    };
    if(s){ Object.assign(s,obj); } else { DATA.students.push(obj); }
    save(STORE_KEYS.students).then(()=>{ closeModal(); render(); showToast(s?"Student updated":"Student added"); });
  }, s? [{label:'Delete', danger:true, onClick:()=>{
      if(confirm("Delete this student? All related timetable, homework, payment, attendance and test records will remain but be unlinked.")){
        DATA.students = DATA.students.filter(x=>x.id!==s.id);
        save(STORE_KEYS.students).then(()=>{ closeModal(); go('students'); showToast("Student deleted"); });
      }
    }}]: []);
  // wire dynamic share rows
  setTimeout(()=>{
    recalcShareBar();
    document.getElementById('add-share-row').addEventListener('click',()=>{
      document.getElementById('share-rows').insertAdjacentHTML('beforeend', shareRowHTML(null));
      recalcShareBar();
    });
    document.getElementById('share-rows').addEventListener('click',(e)=>{
      if(e.target.closest('[data-remove-share]')){
        const row = e.target.closest('[data-share-row]');
        if(document.querySelectorAll('[data-share-row]').length>1) row.remove();
        else { row.querySelector('[data-share-teacher]').value=''; row.querySelector('[data-share-value]').value=''; }
        recalcShareBar();
      }
    });
    document.getElementById('share-rows').addEventListener('input', recalcShareBar);
    document.getElementById('share-rows').addEventListener('change', recalcShareBar);
    document.querySelector('input[name="totalFee"]').addEventListener('input', recalcShareBar);
  },0);
}

/* =========================================================
   TIMETABLE HELPERS
========================================================= */
function fmtTime(t){
  if(!t || String(t).indexOf(':')<0) return '';
  const parts = String(t).split(':').map(Number);
  const h = parts[0], m = parts[1]||0;
  return (((h+11)%12)+1)+':'+String(m).padStart(2,'0')+' '+(h>=12?'PM':'AM');
}
function durationText(start,end){
  if(!start || !end) return '';
  const a = start.split(':').map(Number), b = end.split(':').map(Number);
  const mins = (b[0]*60+b[1]) - (a[0]*60+a[1]);
  if(mins<=0) return '';
  const h = Math.floor(mins/60), m = mins%60;
  return ((h? h+'h ':'') + (m? m+'m':'')).trim();
}
function timeSpanText(startTime,endTime){
  if(!startTime || !endTime) return '';
  const d = durationText(startTime,endTime);
  return fmtTime(startTime)+' – '+fmtTime(endTime)+(d? ' · '+d : '');
}
/* A holder is a template or a custom student timetable. Its time is set ONCE for the whole study session. */
function holderTime(h){
  if(h.startTime && h.endTime) return {startTime:h.startTime, endTime:h.endTime};
  const ss = (h.slots||[]).map(x=>x.start).filter(Boolean).sort();
  const es = (h.slots||[]).map(x=>x.end).filter(Boolean).sort();
  return {startTime: ss[0]||'', endTime: es.length? es[es.length-1] : ''};
}
function inheritTime(sl, holder){
  const t = holderTime(holder);
  return Object.assign({}, sl, {start: sl.start || t.startTime, end: sl.end || t.endTime, ownTime: !!(sl.start && sl.end)});
}
function resolveStudentTT(sid){
  const tt = DATA.studentTT[sid];
  if(!tt) return null;
  if(tt.templateId){
    const tpl = DATA.templates.find(t=>t.id===tt.templateId);
    if(!tpl) return null;
    const t = holderTime(tpl);
    return {kind:'template', templateId:tpl.id, name:tpl.name, startTime:t.startTime, endTime:t.endTime, slots:(tpl.slots||[]).map(sl=>inheritTime(sl,tpl))};
  }
  if(!(tt.slots||[]).length) return null;
  const t = holderTime(tt);
  return {kind:'custom', templateId:null, name:'Custom timetable', startTime:t.startTime, endTime:t.endTime, slots:(tt.slots||[]).map(sl=>inheritTime(sl,tt))};
}
function ttSignature(r){
  if(r.kind==='template') return 'T:'+r.templateId;
  return 'C:'+(r.startTime||'')+'-'+(r.endTime||'')+'|'+r.slots.map(x=>[x.day,x.start,x.end,String(x.subject||'').trim().toLowerCase(),x.teacherId||''].join('~')).sort().join('|');
}
/* Classes across all students, merged so a class shared by many students appears once. */
function mergedSlotsFor(filterFn, dayFilter){
  const agg = {};
  DATA.students.forEach(st=>{
    const r = resolveStudentTT(st.id);
    if(!r) return;
    r.slots.filter(sl=>filterFn(sl) && (!dayFilter || sl.day===dayFilter)).forEach(sl=>{
      const k = [sl.day, sl.start, sl.end, String(sl.subject||'').trim().toLowerCase(), sl.teacherId||''].join('|');
      (agg[k] = agg[k] || {slot:sl, names:[]}).names.push(st.name);
    });
  });
  return Object.values(agg).map(a=>Object.assign({}, a.slot, {
    studentName: a.names.length>3 ? a.names.length+' students' : a.names.join(', '),
    studentNames: a.names
  }));
}
const DAY_CHOICES = ['Mon','Tue','Wed','Thu','Fri','Sat'];
function dayExpand(v){
  if(v==='Mon–Fri') return ['Mon','Tue','Wed','Thu','Fri'];
  if(v==='Mon–Sat') return ['Mon','Tue','Wed','Thu','Fri','Sat'];
  return [v];
}
function tplSlotRow(sl){
  sl = sl||{};
  return `<div class="share-row" data-tslot-row style="grid-template-columns:1fr 1.3fr 1.2fr auto">
    <select data-tslot-day>
      ${DAY_CHOICES.map(d=>`<option ${sl.day===d?'selected':''}>${d}</option>`).join('')}
      <option value="Mon–Fri">Mon–Fri</option><option value="Mon–Sat">Mon–Sat</option>
    </select>
    <input data-tslot-subject placeholder="Subject" value="${esc(sl.subject||'')}" />
    <select data-tslot-teacher><option value="">Teacher…</option>${DATA.teachers.map(t=>`<option value="${t.id}" ${sl.teacherId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
    <button type="button" class="btn btn-sm btn-ghost" data-remove-tslot>✕</button>
  </div>`;
}
function wireTSlotList(){
  const list = document.getElementById('tslot-list');
  const addBtn = document.getElementById('add-tslot-row');
  if(list) list.addEventListener('click',(e)=>{
    const rm = e.target.closest('[data-remove-tslot]');
    if(rm) rm.closest('[data-tslot-row]').remove();
  });
  if(addBtn) addBtn.addEventListener('click',()=>{ list.insertAdjacentHTML('beforeend', tplSlotRow({})); });
}
/* Reads + validates the time fields and slot rows of a form. */
function readTimetableForm(form, errors, fields){
  const startEl = form.querySelector('[name="startTime"]'), endEl = form.querySelector('[name="endTime"]');
  const startTime = startEl.value, endTime = endEl.value;
  if(!startTime){ errors.push("Choose when the study time starts."); fields.push(startEl); }
  if(!endTime){ errors.push("Choose when the study time ends."); fields.push(endEl); }
  if(startTime && endTime && endTime<=startTime){ errors.push("The end time must be later than the start time."); fields.push(endEl); }
  const rows = Array.from(form.querySelectorAll('[data-tslot-row]'));
  const seen = {}, slots = [];
  let anyFilled = false;
  rows.forEach((r,i)=>{
    const dayEl = r.querySelector('[data-tslot-day]'), subEl = r.querySelector('[data-tslot-subject]'), teEl = r.querySelector('[data-tslot-teacher]');
    const subject = subEl.value.trim();
    if(!subject && !teEl.value) return;
    anyFilled = true;
    if(!subject){ errors.push(`Row ${i+1}: enter the subject.`); fields.push(subEl); return; }
    dayExpand(dayEl.value).forEach(day=>{
      const k = day+'|'+subject.toLowerCase()+'|'+(teEl.value||'');
      if(seen[k]) return;
      seen[k] = true;
      slots.push({day, subject, teacherId: teEl.value});
    });
  });
  if(!anyFilled){ errors.push("Add at least one day with a subject."); const first = rows[0] && rows[0].querySelector('[data-tslot-subject]'); if(first) fields.push(first); }
  return {startTime, endTime, slots};
}

/* ---- Fallback priority (user-configurable via UI, stored in localStorage) ---- */
function getFallbackOrder(){
  try{ const r = localStorage.getItem(LOCAL_PREFIX+'aiFallbackOrder'); return r? JSON.parse(r) : null; }catch(e){ return null; }
}
function saveFallbackOrder(arr){ try{ localStorage.setItem(LOCAL_PREFIX+'aiFallbackOrder', JSON.stringify(arr)); }catch(e){} }
function getEffectiveFallbackOrder(){
  const saved = getFallbackOrder();
  const configured = configuredProviders();
  if(saved) return saved.filter(id=>configured.includes(id)).concat(configured.filter(id=>!saved.includes(id)));
  return configured;
}

/* ---- Error classification ---- */
function classifyError(status, body){
  if(status===401||status===403) return 'auth';
  if(status===429) return 'quota';
  if(status===402) return 'billing';
  if(status>=500) return 'unavailable';
  if(body && /safety|blocked|content.filter/i.test(JSON.stringify(body))) return 'safety';
  return 'error';
}
function humanError(providerId, type, detail){
  const name = (AI_PROVIDERS[providerId]||{}).label || providerId;
  if(type==='nokey') return name+' API key is not configured. Go to AI Settings to add it.';
  if(type==='auth') return name+' returned an authentication error. Check your API key in AI Settings.';
  if(type==='quota') return name+' quota has been exceeded. Try another configured provider or check your account.';
  if(type==='billing') return name+' requires billing to be set up. Check your account.';
  if(type==='unavailable') return name+' is temporarily unavailable. Try again later.';
  if(type==='safety') return name+' blocked this request due to content safety filters.';
  if(type==='noimage') return name+' / the selected model does not support image homework. Choose a vision-capable provider.';
  if(type==='network') return 'Could not reach '+name+'. Check your internet connection.';
  return name+' error: '+(detail||'Unknown error.');
}

/* ---- Provider adapters ---- */
async function callOpenAI(key, model, question, imageBase64, imageMime){
  const messages = [];
  const content = [];
  if(imageBase64) content.push({type:'image_url', image_url:{url:'data:'+imageMime+';base64,'+imageBase64}});
  content.push({type:'text', text: question || 'Please solve the problem shown in this image, showing full working.'});
  messages.push({role:'user', content});
  const res = await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model, max_tokens:1500, messages})
  });
  const data = await res.json();
  if(!res.ok) return {success:false, error:humanError('openai',classifyError(res.status,data),data.error&&data.error.message), errorType:classifyError(res.status,data)};
  return {success:true, text:(data.choices[0].message.content||'').trim(), provider:'openai', model};
}

async function callGoogle(key, model, question, imageBase64, imageMime){
  const parts = [];
  if(imageBase64) parts.push({inline_data:{mime_type:imageMime, data:imageBase64}});
  parts.push({text: question || 'Please solve the problem shown in this image, showing full working.'});
  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({contents:[{parts}]})
  });
  const data = await res.json();
  if(!res.ok) return {success:false, error:humanError('google',classifyError(res.status,data),(data.error&&data.error.message)||''), errorType:classifyError(res.status,data)};
  const text = ((data.candidates||[])[0]||{}).content&&data.candidates[0].content.parts.map(p=>p.text||'').join('');
  return {success:true, text:(text||'').trim(), provider:'google', model};
}

async function callAnthropic(key, model, question, imageBase64, imageMime){
  const content = [];
  if(imageBase64) content.push({type:'image', source:{type:'base64', media_type:imageMime, data:imageBase64}});
  content.push({type:'text', text: question || 'Please solve the problem shown in this image, showing full working.'});
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model, max_tokens:1500, messages:[{role:'user', content}]})
  });
  const data = await res.json();
  if(!res.ok) return {success:false, error:humanError('anthropic',classifyError(res.status,data),(data.error&&data.error.message)||''), errorType:classifyError(res.status,data)};
  return {success:true, text:(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n\n').trim(), provider:'anthropic', model};
}

async function callOpenAICompat(providerId, baseUrl, key, model, question, imageBase64, imageMime){

  const headers = {'Content-Type':'application/json','Authorization':'Bearer '+key};

  const res = await fetch(baseUrl+'/chat/completions',{
    method:'POST', headers,

  const data = await res.json();
  if(!res.ok) return {success:false, error:humanError(providerId,classifyError(res.status,data),(data.error&&data.error.message)||''), errorType:classifyError(res.status,data)};
  return {success:true, text:((data.choices[0].message.content)||'').trim(), provider:providerId, model};

async function solveWithProvider(providerId, question, imageBase64, imageMime){
  const p = AI_PROVIDERS[providerId];
  if(!p) return {success:false, error:'Unknown provider: '+providerId, errorType:'error'};
  const key = getStoredApiKey(providerId);
  if(!key) return {success:false, error:humanError(providerId,'nokey'), errorType:'nokey'};
  if(imageBase64 && !p.vision) return {success:false, error:humanError(providerId,'noimage'), errorType:'noimage'};
  const model = p.defaultModel;
  const prompt = (question||'Please solve the problem shown in this image, showing full working.')+
    '\n\nExplain the solution step by step, clearly, in a way a school student could follow.';
  try{
    if(providerId==='openai')   return await callOpenAI(key, model, prompt, imageBase64, imageMime);
    if(providerId==='google')   return await callGoogle(key, model, prompt, imageBase64, imageMime);
    if(providerId==='anthropic')return await callAnthropic(key, model, prompt, imageBase64, imageMime);
    if(providerId==='xai')      return await callOpenAICompat('xai','https://api.x.ai/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='deepseek') return await callOpenAICompat('deepseek','https://api.deepseek.com/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='dashscope')return await callOpenAICompat('dashscope','https://dashscope.aliyuncs.com/compatible-mode/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='dashscope_cn')return await callOpenAICompat('dashscope_cn','https://dashscope.aliyuncs.com/compatible-mode/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='zhipu')    return await callZhipu('zhipu','https://open.bigmodel.cn/api/paas/v4',key,model,prompt,imageBase64,imageMime);
    if(providerId==='zhipu_cn') return await callZhipu('zhipu_cn','https://open.bigmodel.cn/api/paas/v4',key,model,prompt,imageBase64,imageMime);
    if(providerId==='minimax')  return await callMiniMax('minimax','https://api.minimax.chat/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='minimax_cn')return await callMiniMax('minimax_cn','https://api.minimax.chat/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='openrouter')return await callOpenAICompat('openrouter','https://openrouter.ai/api/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='mistral')  return await callOpenAICompat('mistral','https://api.mistral.ai/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='moonshot') return await callOpenAICompat('moonshot','https://api.moonshot.cn/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='groq')     return await callOpenAICompat('groq','https://api.groq.com/openai/v1',key,model,prompt,imageBase64,imageMime);
    if(providerId==='nvidia')   return await callOpenAICompat('nvidia','https://integrate.api.nvidia.com/v1',key,model,prompt,imageBase64,imageMime);
    return {success:false, error:'Provider not implemented: '+providerId, errorType:'error'};
  }catch(e){
    return {success:false, error:humanError(providerId,'network',e.message), errorType:'network'};
  }
}

async function testProvider(providerId){
  const p = AI_PROVIDERS[providerId];

        </div>
        <div class="flex gap8">
          <button class="btn btn-gold" id="ai-solve-btn" ${aiState.loading?'disabled':''}>${aiState.loading?'Thinking…':'Solve with AI'}</button>
          ${aiState.imageBase64?`<button class="btn btn-ghost" id="ai-clear-image">Remove photo</button>`:''}
        </div>
        <div class="hint mt8">Tip: mention the subject and class level for a more precise answer.</div>
      </div>
      <div class="panel">
        <div class="panel-title mb12">Solution</div>
        ${aiState.loading?`<div class="empty-state"><div class="ei">…</div>Working through it.</div>`:
          aiState.lastAnswer?`
            ${aiState.lastProviderLabel?`<div class="hint mb8">Solved by: <b>${esc(aiState.lastProviderLabel)}</b>${aiState.lastModel?' — <span class="mono">'+esc(aiState.lastModel)+'</span>':''}</div>`:''}
            <div class="ai-answer">${esc(aiState.lastAnswer)}</div>
            <div class="flex gap8 mt12"><button class="btn btn-sm" id="ai-save-to-hw">Save to a homework record</button></div>`
          :`<div class="empty-state"><div class="ei">✺</div>Ask a question to see the step-by-step solution here.</div>`}
      </div>
    </div>`;
  }

  return `
  <div class="topbar">
    <div><div class="page-title">AI Homework Helper</div><div class="page-sub">Supports 16 AI providers — configure keys in AI Settings</div></div>
  </div>
  <div class="tabbar">
    <button class="tabbtn ${tab==='solve'?'active':''}" data-ai-tab="solve">Solve Homework</button>
    <button class="tabbtn ${tab==='settings'?'active':''}" data-ai-tab="settings">AI Settings</button>
  </div>
  ${solveHTML}${settingsHTML}`;
}
async function handleAISolve(){
  const q = document.getElementById('ai-question').value.trim();
  if(!q && !aiState.imageBase64){ showToast('Type a question or upload a photo first.'); return; }
  const selProv = (document.getElementById('ai-provider-select')||{}).value || aiState.selectedProvider || 'auto';
  aiState.selectedProvider = selProv;
  aiState.lastQuestion = q;
  aiState.loading = true; aiState.lastAnswer = null; aiState.lastProviderLabel = null; aiState.lastModel = null;
  render();

  let result;
  if(selProv === 'auto'){
    const order = getEffectiveFallbackOrder();
    if(!order.length){ aiState.lastAnswer = 'No API keys configured. Go to AI Settings to add a provider key.'; aiState.loading=false; render(); return; }
    for(const pid of order){
      result = await solveWithProvider(pid, q, aiState.imageBase64, aiState.imageMime);
      if(result.success) break;
      if(result.errorType==='auth' || result.errorType==='noimage') break; // don't try next for auth/image errors
      if(result.errorType==='quota' || result.errorType==='unavailable') continue; // try next
      break;
    }
  } else {
    result = await solveWithProvider(selProv, q, aiState.imageBase64, aiState.imageMime);
  }

  if(result && result.success){
    aiState.lastAnswer = result.text || 'No answer returned — please try rephrasing the question.';
    aiState.lastProviderLabel = (AI_PROVIDERS[result.provider]||{}).label || result.provider;
    aiState.lastModel = result.model || null;
  } else {
    aiState.lastAnswer = (result && result.error) || 'Something went wrong. Please try again.';
    aiState.lastProviderLabel = null;
  }
  aiState.loading = false;
  render();
}
function handleSaveToHomework(){
  if(!aiState.lastAnswer) return;
  const linked = STATE.hwLinkId;
  const options = DATA.homework.map(h=>`<option value="${h.id}" ${linked===h.id?'selected':''}>${esc((findStudent(h.studentId)||{}).name||'?')} — ${esc(h.subject)} (${fmtDate(h.assignedDate)})</option>`).join('');
  openModal("Save solution to homework", `
    <div class="field"><label>Choose a homework record</label><select name="hwId">${options||'<option value="">No homework records yet</option>'}</select></div>
    <div class="hint mt4">The AI's solution will be added to that homework's remarks.</div>
  `, (fd)=>{
    const hw = DATA.homework.find(h=>h.id===fd.get('hwId'));
    if(!hw) return "Select a homework record.";
    hw.remarks = (hw.remarks? hw.remarks+"\n\n":"") + "AI solution:\n" + aiState.lastAnswer;
    hw.status = hw.status==='Pending'? 'Submitted': hw.status;
    STATE.hwLinkId = null;
    save(STORE_KEYS.homework).then(()=>{ closeModal(); showToast("Saved to homework record"); });
  });
}

function statusControl(studentId, cycleKey, isPaid){
  const onPaid = 'background:var(--green);color:#fff;border-color:var(--green)';
  const onUnpaid = 'background:var(--red);color:#fff;border-color:var(--red)';
  return `<div class="flex gap6" style="flex-wrap:nowrap">
    <button class="btn btn-sm" style="${isPaid?onPaid:''}" data-set-status="Paid" data-student="${studentId}" data-cycle="${cycleKey}">Paid</button>
    <button class="btn btn-sm" style="${!isPaid?onUnpaid:''}" data-set-status="Unpaid" data-student="${studentId}" data-cycle="${cycleKey}">Unpaid</button>
    <button class="btn btn-sm btn-ghost" data-record-payment="${studentId}" data-cycle="${cycleKey}" title="Edit date or note">Details</button>
  </div>`;
}
function setFeeStatus(studentId, cycleKey, status){
  const st = findStudent(studentId);
  if(!st) return;
  const rec = getPaymentRecord(studentId, cycleKey);
  const amount = status==='Paid' ? getFeeForCycle(st, cycleKey) : 0;
  if(rec){
    if(status==='Paid' && feeStatus(rec)!=='Paid') rec.date = todayISO();
    rec.status = status; rec.amount = amount;
  } else {
    DATA.payments.push({ id:uid(), studentId, cycleKey, amount, date: status==='Paid'?todayISO():'', status, note:'' });
  }
  save(STORE_KEYS.payments).then(()=>{ render(); showToast(status==='Paid' ? st.name+" — marked Paid" : st.name+" — marked Unpaid"); });
}
function viewPayments(){
  const ref = STATE.paymentsMonth;
  const label = MONTH_NAMES[ref.getMonth()]+" "+ref.getFullYear();
  const rows = DATA.students.map(s=>{
    const {cycleKey, cycleStart, cycleEnd} = getCycleForMonth(s, ref);
    const pay = getPaymentRecord(s.id, cycleKey);
    const fee = getFeeForCycle(s, cycleKey);
    const paid = feePaid(s, cycleKey, pay);
    const due = feeDue(s, cycleKey, pay);
    const status = feeStatus(pay);
    return {s, cycleKey, cycleStart, cycleEnd, fee, paid, due, status};
  });
  // Per-teacher totals for this reference month
  const teacherTotals = {};
  DATA.teachers.forEach(t=>teacherTotals[t.id]={collected:0,pending:0});
  rows.forEach(r=>{
    (r.s.shares||[]).forEach(sh=>{
      if(!teacherTotals[sh.teacherId]) teacherTotals[sh.teacherId]={collected:0,pending:0};
      teacherTotals[sh.teacherId].collected += teacherCutOfAmount(r.s, sh.teacherId, r.paid);
      teacherTotals[sh.teacherId].pending += teacherCutOfAmount(r.s, sh.teacherId, r.due);
    });
  });

  return `
  <div class="topbar">
    <div><div class="page-title">Payments</div><div class="page-sub">Fees are tracked on each student's own billing cycle</div></div>
    <div class="month-switch">
      <button id="pm-prev">‹</button>
      <div class="month-label">${label}</div>
      <button id="pm-next">›</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title mb12">Per-teacher summary — ${label}</div>
    ${DATA.teachers.length===0? emptyState("No teachers yet",""):
    `<table><thead><tr><th>Teacher</th><th>Collected</th><th>Pending</th></tr></thead><tbody>
    ${DATA.teachers.map(t=>`<tr class="clickable" data-nav="teacher-detail" data-id="${t.id}" data-tab="earnings">
      <td><b>${esc(t.name)}</b></td>
      <td class="num" style="color:var(--green)">${money(teacherTotals[t.id].collected)}</td>
      <td class="num" style="color:var(--red)">${money(teacherTotals[t.id].pending)}</td>
    </tr>`).join('')}
    </tbody></table>`}
  </div>

  <div class="panel">
    <div class="panel-title mb12">Student fee status — ${label}</div>
    ${rows.length===0? emptyState("No students yet",""):
    `<table><thead><tr><th>Student</th><th>Cycle</th><th>Total fee</th><th>Due</th><th>Status</th><th>Mark as</th></tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td>${esc(r.s.name)}</td>
      <td class="num" style="font-size:12px">${fmtDate(r.cycleStart)} – ${fmtDate(r.cycleEnd)}</td>
      <td class="num">${money(r.fee)}</td>
      <td class="num">${money(r.due)}</td>
      <td>${statusBadge(r.status)}</td>
      <td>${statusControl(r.s.id, r.cycleKey, r.status==='Paid')}</td>

    </tbody></table>`}
  </div>
  `;
}
function openPaymentModal(studentId, cycleKey){
  const s = findStudent(studentId);
  if(!s) return;
  const existing = getPaymentRecord(studentId, cycleKey);
  const feeThisCycle = getFeeForCycle(s, cycleKey);
  openModal("Payment status — "+s.name+" ("+cycleKey+")", `
    <div class="form-grid">
      <div class="field"><label>Status</label><select name="status">${['Paid','Unpaid'].map(st=>`<option ${feeStatus(existing)===st?'selected':''}>${st}</option>`).join('')}</select></div>

}

        </div>
      </td>
    </tr>`).join('')}
    </tbody></table>`}

function monthlyAttendanceSummary(){
  const now = new Date();
  const ym = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,'0');
  if(DATA.students.length===0) return emptyState("No students yet","");
  const rows = DATA.students.map(s=>{
    const recs = DATA.attendance.filter(a=>a.studentId===s.id && a.date.startsWith(ym));
    const present = recs.filter(a=>a.status==='Present').length;
    const pct = recs.length? Math.round(present/recs.length*100):0;
    return {s, pct, total:recs.length};
  });
  return `<table><thead><tr><th>Student</th><th>Sessions marked</th><th>Attendance</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td>${r.total}</td><td>
    <div class="flex gap8"><div class="progress-track" style="width:120px"><div class="progress-fill" style="width:${r.pct}%"></div></div><span class="num" style="font-size:12px">${r.pct}%</span></div>
  </td></tr>`).join('')}
  </tbody></table>`;
}

function viewRegister(){
  const now = new Date();
  const year = STATE.registerYear || now.getFullYear();
  const cls = STATE.registerClass || '';
  const students = DATA.students.filter(s=>!cls || s.class===cls);
  const monthShort = MONTH_NAMES.map(n=>n.slice(0,3));
  const monthPaid = new Array(12).fill(0), monthTotal = new Array(12).fill(0);
  const rows = students.map(s=>{
    let paidCount = 0, dueCount = 0;
    const cells = monthShort.map((mn,mi)=>{
      const future = getCycleForMonth(s, new Date(year,mi,1)).cycleStart > now;
      if(future) return `<td style="text-align:center" class="faint">–</td>`;
      const key = year+"-"+String(mi+1).padStart(2,'0');
      const rec = getPaymentRecord(s.id, key);
      const paid = !!(rec && rec.status==='Paid');
      monthTotal[mi]++;
      if(paid){ paidCount++; monthPaid[mi]++; } else { dueCount++; }
      const style = paid? 'background:var(--green-soft);color:var(--green);border-color:var(--green-soft)' : 'background:var(--red-soft);color:var(--red);border-color:var(--red-soft)';
      return `<td style="text-align:center"><button class="btn btn-sm" style="padding:2px 8px;${style}" title="${esc(s.name)} — ${mn} ${year}: ${paid?'Paid':'Unpaid'} (click to change)" data-toggle-fee data-student="${s.id}" data-cycle="${key}">${paid?'✓':'✕'}</button></td>`;
    }).join('');
    return `<tr>
      <td style="white-space:nowrap"><span data-nav="student-detail" data-id="${s.id}" style="cursor:pointer"><b>${esc(s.name)}</b></span><div class="faint" style="font-size:11.5px">${esc(s.class)}</div></td>
      ${cells}
      <td class="num" style="text-align:center;color:var(--green)">${paidCount}</td>
      <td class="num" style="text-align:center;color:var(--red)">${dueCount}</td>
    </tr>`;
  }).join('');

  return `
  <div class="topbar">
    <div><div class="page-title">Fee Register</div><div class="page-sub">Month-by-month fee record of every student — click any cell to mark paid or unpaid</div></div>
    <div class="month-switch">
      <button id="reg-prev">‹</button>
      <div class="month-label">${year}</div>
      <button id="reg-next">›</button>
    </div>
  </div>
  <div class="panel">
    <div class="flex gap8 mb12" style="flex-wrap:wrap">
      <select class="filter" id="reg-class"><option value="">All classes</option>${CLASS_OPTIONS.map(c=>`<option ${cls===c?'selected':''}>${c}</option>`).join('')}</select>
      <span class="chip"><span style="color:var(--green)">✓</span> Paid</span>
      <span class="chip"><span style="color:var(--red)">✕</span> Unpaid</span>
      <span class="chip"><span class="faint">–</span> Future month</span>

async function handleSupabaseSave(){
  const cfg = {
    url: document.getElementById('sb-url').value.trim().replace(/\/$/,''),
    anonKey: document.getElementById('sb-anonKey').value.trim()
  };
  const statusEl = document.getElementById('sb-status');
  if(!cfg.url || !cfg.anonKey){ statusEl.textContent = "Both the Project URL and anon key are required."; statusEl.style.color = 'var(--red)'; return; }
  if(!/^https:\/\/.+\.supabase\.co$/.test(cfg.url)){ statusEl.textContent = "That doesn't look like a Supabase project URL (should look like https://xxxx.supabase.co)."; statusEl.style.color = 'var(--red)'; return; }
  statusEl.textContent = "Connecting…"; statusEl.style.color = '';
  unsubscribeSupabase();
  sbReady = false; sbClient = null;
  setSupabaseConfig(cfg);
  try{
    const ok = await initSupabase();
    if(!ok) throw new Error("Couldn't load the Supabase client.");
    // round-trip test write/read so a wrong key or missing table is caught here, not silently later
    const { error: writeErr } = await sbClient.from('tuition_ledger').upsert({ key:'_connectionTest', json: String(Date.now()), updated_at: new Date().toISOString() });
    if(writeErr) throw writeErr;
    statusEl.style.color = 'var(--green)'; statusEl.textContent = "Connected — uploading your current data…";
    await Promise.all(Object.values(STORE_KEYS).map(k=>save(k)));
    subscribeSupabase();
    showToast("Cloud sync connected");
    render();
  }catch(e){
    console.error(e);
    sbReady = false;
    statusEl.style.color = 'var(--red)';
    statusEl.textContent = "Couldn't connect — check the URL and key, and that you ran the table-creation SQL in Supabase's SQL editor (see above). Error: " + (e && e.message ? e.message : 'unknown');
  }
}
function handleSupabaseDisconnect(){
  if(!confirm("Stop syncing to the cloud? Your data stays safely in this browser, but other devices will no longer see updates from here.")) return;
  unsubscribeSupabase();
  sbReady = false; sbClient = null;
  clearSupabaseConfig();
  showToast("Disconnected from cloud sync");
  render();
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});

  const a = document.createElement('a');
  a.href = url; a.download = 'tuition-backup-'+todayISO()+'.json';

async function importBackup(file){
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!confirm("This will replace all current data with the backup file. Continue?")) return;
    Object.keys(STORE_KEYS).forEach(k=>{ if(parsed[k]!==undefined) DATA[k]=parsed[k]; });

}

/* Shows a clear message box at the top of a form. Accepts a string, an array of strings,
   or {errors:[...], fields:[elements to highlight]}. */
function showModalErrors(err){
  const box = document.getElementById('modal-error');
  if(!box) return;
  let errors = [], fields = [];
  if(typeof err==='string') errors = [err];
  else if(Array.isArray(err)) errors = err;
  else if(err && err.errors){ errors = err.errors; fields = err.fields || []; }
  errors = errors.filter(Boolean);
  document.querySelectorAll('#modal-form .invalid').forEach(x=>x.classList.remove('invalid'));
  if(!errors.length){ box.style.display='none'; return; }
  box.innerHTML = '<div class="alert-title">'+(errors.length>1 ? 'Please fix these '+errors.length+' problems before saving' : 'Please fix this before saving')+'</div><ul>'+errors.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>';
  box.style.display = 'block';
  fields.forEach(f=>{ if(f && f.classList) f.classList.add('invalid'); });
  try{ box.scrollIntoView({block:'nearest'}); }catch(e){}
  const first = fields.find(f=>f && typeof f.focus==='function');
  if(first){ try{ first.focus({preventScroll:true}); }catch(e){} }
}

/* =========================================================
   SORTABLE TABLES — every table in the app can be sorted by clicking a column heading.
   Click once = ascending, twice = descending, third click = original order.
   The chosen sort is remembered for that table while you move between pages.
========================================================= */
const NO_SORT_HEADERS = ['Mark as',''];
function monthIndexOf(name){ return ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(String(name).toLowerCase().slice(0,3)); }
function sortValueOf(cell){
  if(!cell) return {t:'e', v:''};
  const explicit = cell.getAttribute && cell.getAttribute('data-sort-value');
  const txt = (explicit!==null && explicit!==undefined ? explicit : cell.textContent).replace(/\s+/g,' ').trim();
  if(txt==='' || txt==='—' || txt==='–') return {t:'e', v:''};
  let m;
  if((m = txt.match(/^Rs\s*(-?[\d,]+(?:\.\d+)?)$/))) return {t:'n', v:parseFloat(m[1].replace(/,/g,''))};
  if((m = txt.match(/^(-?[\d,]+(?:\.\d+)?)\s*%$/))) return {t:'n', v:parseFloat(m[1].replace(/,/g,''))};
  if((m = txt.match(/^(\d+)\s*\/\s*(\d+)$/)) && Number(m[2])) return {t:'n', v:Number(m[1])/Number(m[2])};
  if((m = txt.match(/^Day\s+(\d+)$/i))) return {t:'n', v:Number(m[1])};
  if(/^-?[\d,]+(?:\.\d+)?$/.test(txt)) return {t:'n', v:parseFloat(txt.replace(/,/g,''))};
  if((m = txt.match(/^(\d{1,2})\s+([A-Za-z]{3,9})\.?\s+(\d{4})/)) && monthIndexOf(m[2])>=0) return {t:'n', v:new Date(Number(m[3]), monthIndexOf(m[2]), Number(m[1])).getTime()};
  if((m = txt.match(/^([A-Za-z]{3,9})\s+(\d{4})/)) && monthIndexOf(m[1])>=0) return {t:'n', v:new Date(Number(m[2]), monthIndexOf(m[1]), 1).getTime()};
  if((m = txt.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/))) return {t:'n', v:new Date(Number(m[1]), Number(m[2])-1, Number(m[3]||1)).getTime()};
  return {t:'s', v:txt.toLowerCase()};
}
function compareSortValues(a,b){
  if(a.t==='n' && b.t==='n') return a.v-b.v;
  if(a.t==='n') return -1;
  if(b.t==='n') return 1;
  return String(a.v).localeCompare(String(b.v), undefined, {numeric:true, sensitivity:'base'});
}
function applyTableSort(table, sig){
  const body = table.querySelector('tbody');
  const head = table.querySelector('thead tr');
  if(!body || !head) return;
  const rows = Array.from(body.children).filter(r=>r.tagName==='TR');
  const state = STATE.sortState[sig];
  const ths = Array.from(head.children);
  ths.forEach((th,i)=>{
    if(!th.classList.contains('sortable')) return;
    const on = !!(state && state.col===i);
    th.classList.toggle('sorted', on);
    th.setAttribute('aria-sort', on ? (state.dir==='asc'?'ascending':'descending') : 'none');
    const ind = th.querySelector('.sort-ind');
    if(ind) ind.textContent = on ? (state.dir==='asc' ? '▲' : '▼') : '⇅';
  });
  if(!state){
    rows.sort((a,b)=>Number(a.getAttribute('data-orig'))-Number(b.getAttribute('data-orig')));
  } else {
    const keyed = rows.map(r=>({r, orig:Number(r.getAttribute('data-orig')), v:sortValueOf(r.children[state.col])}));
    keyed.sort((x,y)=>{
      if(x.v.t==='e' || y.v.t==='e'){
        if(x.v.t===y.v.t) return x.orig-y.orig;
        return x.v.t==='e' ? 1 : -1;
      }
      const c = compareSortValues(x.v,y.v);
      if(c===0) return x.orig-y.orig;
      return state.dir==='asc' ? c : -c;
    });
    keyed.forEach((k,i)=>{ rows[i]=k.r; });
  }
  rows.forEach(r=>body.appendChild(r));
}
function enhanceTables(){
  STATE.sortState = STATE.sortState || {};
  const root = document.getElementById('content');
  if(!root) return;
  root.querySelectorAll('table').forEach((table,ti)=>{
    if(table.hasAttribute('data-nosort')) return;
    const head = table.querySelector('thead tr');
    const body = table.querySelector('tbody');
    if(!head || !body) return;
    const rows = Array.from(body.children).filter(r=>r.tagName==='TR');
    if(rows.length===0 || rows.some(r=>r.querySelector('td.empty-row'))) return;
    rows.forEach((r,i)=>r.setAttribute('data-orig', i));
    const ths = Array.from(head.children);
    const sig = STATE.view+'|'+(STATE.detailTab||'')+'|'+ti+'|'+ths.map(t=>t.textContent.trim()).join('/');
    ths.forEach((th,i)=>{
      const label = th.textContent.trim();
      if(NO_SORT_HEADERS.includes(label)) return;
      th.classList.add('sortable');
      th.setAttribute('title','Click to sort');
      th.insertAdjacentHTML('beforeend','<span class="sort-ind">⇅</span>');
      th.addEventListener('click',()=>{
        const cur = STATE.sortState[sig];
        if(!cur || cur.col!==i) STATE.sortState[sig] = {col:i, dir:'asc'};
        else if(cur.dir==='asc') STATE.sortState[sig] = {col:i, dir:'desc'};
        else delete STATE.sortState[sig];
        applyTableSort(table, sig);
      });
    });
    applyTableSort(table, sig);
  });
}

    setFeeStatus(el.getAttribute('data-student'), el.getAttribute('data-cycle'), el.getAttribute('data-set-status'));
  }));
  document.querySelectorAll('[data-toggle-fee]').forEach(el=>el.addEventListener('click',(e)=>{
    e.stopPropagation();
    const sid = el.getAttribute('data-student'), ck = el.getAttribute('data-cycle');
    setFeeStatus(sid, ck, feeStatus(getPaymentRecord(sid, ck))==='Paid' ? 'Unpaid' : 'Paid');
  }));
  const feePrev = document.getElementById('fee-prev'), feeNext = document.getElementById('fee-next');
  if(feePrev) feePrev.addEventListener('click',()=>{ STATE.feeYear = (STATE.feeYear||new Date().getFullYear())-1; render(); });
  if(feeNext) feeNext.addEventListener('click',()=>{ STATE.feeYear = (STATE.feeYear||new Date().getFullYear())+1; render(); });
  const regPrev = document.getElementById('reg-prev'), regNext = document.getElementById('reg-next'), regClass = document.getElementById('reg-class');
  if(regPrev) regPrev.addEventListener('click',()=>{ STATE.registerYear = (STATE.registerYear||new Date().getFullYear())-1; render(); });
  if(regNext) regNext.addEventListener('click',()=>{ STATE.registerYear = (STATE.registerYear||new Date().getFullYear())+1; render(); });
  if(regClass) regClass.addEventListener('change',()=>{ STATE.registerClass = regClass.value; render(); });

  const addTestBtn = document.getElementById('btn-add-test');
  if(addTestBtn) addTestBtn.addEventListener('click',()=>openTestModal(null));

  const exportBtn = document.getElementById('btn-export');
  if(exportBtn) exportBtn.addEventListener('click', exportBackup);
  const sbSaveBtn = document.getElementById('sb-save');
  if(sbSaveBtn) sbSaveBtn.addEventListener('click', handleSupabaseSave);
  const sbDisconnectBtn = document.getElementById('sb-disconnect');
  if(sbDisconnectBtn) sbDisconnectBtn.addEventListener('click', handleSupabaseDisconnect);
  const importFile = document.getElementById('import-file');
  if(importFile) importFile.addEventListener('change',(e)=>{ if(e.target.files[0]) importBackup(e.target.files[0]); });
  const resetBtn = document.getElementById('btn-reset');
  if(resetBtn) resetBtn.addEventListener('click', resetAllData);
  enhanceTables();
}
function renderDashboardSearchOnly(){
  // lightweight refresh of just the dashboard when typing search, without losing focus
  if(STATE.view!=='dashboard') return;
  const content = document.getElementById('content');
  const activeEl = document.activeElement;
  const cursorPos = activeEl && activeEl.id==='global-search'? activeEl.selectionStart: null;
  content.innerHTML = viewDashboard();
  bindGlobalEvents();
  const el = document.getElementById('global-search');
  if(el){ el.focus(); if(cursorPos!==null) el.selectionStart = el.selectionEnd = cursorPos; }
}

/* =========================================================
   INIT
========================================================= */
async function init(){
  await loadAll();
  render();
}
init();

})();
</script>
